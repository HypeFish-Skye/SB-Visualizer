[build-system]
requires = ["scikit-build-core>=0.8.0", "pybind11"]
build-backend = "scikit_build_core.build"

[project]
name = "smart_behaviors"
version = "0.1.0"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "duckdb>=0.10.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.0.0",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["server/smart_behaviors"]
cmake.source-dir = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]